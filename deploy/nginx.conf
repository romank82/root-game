# /etc/nginx/sites-available/root-game
# Активация:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/root-game
#   sudo ln -s /etc/nginx/sites-available/root-game /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Домен подставляется certbot'ом при первом выпуске сертификата:
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
# До этого замените your-domain.com вручную.

# --- Redirect HTTP → HTTPS ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

# --- HTTPS --------------------------------------------------------------------
server {
    # ВАЖНО: на nginx 1.24 (Ubuntu 24.04) HTTP/2 включается параметром
    # listen, а не директивой `http2 on` (она появилась в 1.25.1).
    # На nginx >= 1.25.1 директива ниже вызовет предупреждение о deprecated,
    # но конфиг останется рабочим.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name your-domain.com www.your-domain.com;

    # SSL — заполняется certbot автоматически при первом запуске:
    #   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers (аудит безопасности, F-02) ---------------------------
    # ВАЖНО: nginx не наследует add_header в location, если тот объявляет
    # СВОИ add_header (например Cache-Control у ассетов), поэтому набор
    # продублирован в тех location, где это критично.
    # HSTS: 1 год, без preload — preload необратим и требует согласия владельца.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # X-Frame-Options НЕ ставим сознательно: Telegram Mini App в Telegram
    # Web/Desktop открывается в iframe с домена web.telegram.org, и
    # SAMEORIGIN/ DENY его сломает. Защиту от кликджекинга даёт
    # CSP frame-ancestors ниже — он современнее и умеет список доменов.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    # CSP: фронт — React/Vite без inline-скриптов и без eval в проде.
    # script-src — telegram-web-app.js; connect-src — Telegram WebView, TON
    # Connect и бэкенд. frame-ancestors заменяет X-Frame-Options (см. выше)
    # и разрешает фрейм только с доменов Telegram.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://*.telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.telegram.org wss://*.telegram.org https://*.toncenter.com https://*.tonapi.io https://*.tonconnect.com https://*.mytonwallet.io https://*.tonkeeper.com; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # --- Frontend (React dist) ------------------------------------------------
    # Каталог, куда deploy.sh копирует содержимое repo/dist.
    root /opt/root-game/frontend/dist;
    index index.html;

    # Хешированные ассеты Vite: имя файла меняется при каждой сборке,
    # поэтому их можно кэшировать надолго. try_files $uri =404 обязателен:
    # без него отсутствующий файл молча получит index.html с кодом 200,
    # и браузер попытается выполнить HTML как JavaScript.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # add_header в location отменяет наследование серверных заголовков,
        # поэтому критичные для статики продублированы здесь.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # index.html НЕ кэшируем: он ссылается на конкретные хеши ассетов,
    # и закэшированная старая копия не даст игроку получить новую сборку.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires off;
        # Полный набор заголовков повторно: add_header в location отменяет
        # наследование серверных. index.html — то, что реально исполняет
        # браузер, поэтому CSP здесь важнее всего.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://*.telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.telegram.org wss://*.telegram.org https://*.toncenter.com https://*.tonapi.io https://*.tonconnect.com https://*.mytonwallet.io https://*.tonkeeper.com; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # TON Connect: кошелёк (Tonkeeper и др.) загружает manifest из своего
    # вебвью. Без Access-Control-Allow-Origin браузер блокирует запрос, и
    # подключение кошелька молча не происходит. Разрешаем любой origin: файл
    # публичный и не содержит секретов.
    location = /tonconnect-manifest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/json;
        try_files $uri =404;
    }

    # --- Backend API (FastAPI через gunicorn/uvicorn) --------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Telegram webhook (без префикса /api) ---------------------------------
    location /webhook/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check ----------------------------------------------------------
    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }
}
